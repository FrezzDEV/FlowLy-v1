services:
  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/flowly
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      YTDLP_PATH: /usr/local/bin/yt-dlp
      PREFER_YTDLP: ${PREFER_YTDLP:-true}
    depends_on:
      mongo:
        condition: service_started

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - flowly-mongo:/data/db

volumes:
  flowly-mongo:
