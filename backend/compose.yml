services:
  api:
    build: .
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/flowly
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SHULKER_API_URL: ${SHULKER_API_URL:-http://host.docker.internal:8000}
      SHULKER_TIMEOUT_MS: ${SHULKER_TIMEOUT_MS:-12000}
      SHULKER_FALLBACK_YOUTUBE: ${SHULKER_FALLBACK_YOUTUBE:-false}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YTDLP_PATH: /usr/local/bin/yt-dlp
      PREFER_YTDLP: ${PREFER_YTDLP:-true}
    depends_on:
      mongo:
        condition: service_started

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - flowly-mongo:/data/db

volumes:
  flowly-mongo:
